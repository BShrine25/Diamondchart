name: Delete old PNG cards
on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Type YES to actually delete (leave blank to just preview)'
        required: false
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preview what would be deleted
        run: |
          echo "PNG files found at repo root:"
          find . -maxdepth 1 -name "*.png" | wc -l
          find . -maxdepth 1 -name "*.png"
      - name: Delete PNGs (only if confirmed)
        if: ${{ github.event.inputs.confirm_delete == 'YES' }}
        run: |
          find . -maxdepth 1 -name "*.png" -delete
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove old oversized PNG cards" || echo "nothing to commit"
          git push
